<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>深海喝水打卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #0B1220; color: #F8FAFC; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 28px 20px 36px;
  }
  .sub { font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.55); margin-bottom: 18px; }
  .ring {
    width: 196px; height: 196px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.16);
    background: radial-gradient(circle at 50% 65%, rgba(14,165,233,0.22), rgba(15,23,42,0.8));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .num { font-size: 52px; font-weight: 200; font-variant-numeric: tabular-nums; }
  .goal { font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 4px; }
  .cups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 300px; margin-bottom: 28px; }
  .cup {
    height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: rgba(255,255,255,0.4); transition: all .2s;
  }
  .cup.on { background: rgba(248,250,252,0.92); color: #0B1220; border-color: #fff; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  button {
    border: none; border-radius: 999px; padding: 12px 26px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .primary { background: rgba(255,255,255,0.92); color: #0B1220; }
  .ghost { background: rgba(255,255,255,0.08); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>
  <div class="sub">TODAY · 每日 8 杯饮水节律</div>
  <div class="ring">
    <div class="num" id="cnt">0</div>
    <div class="goal" id="ml">0 / 2000 ml</div>
  </div>
  <div class="cups" id="cups"></div>
  <div class="row">
    <button class="primary" id="add">+ 喝一杯 (250ml)</button>
    <button class="ghost" id="rst">重置</button>
  </div>
<script>
(async () => {
  try { window.jing?.ui?.setHeaderStyle({ bg: '#0B1220', text: '#F8FAFC', dark: true }); } catch {}
  const dayKey = 'water_' + new Date().toISOString().slice(0, 10);
  let count = 0;
  try { const v = await window.jing?.storage?.get(dayKey); if (typeof v === 'number') count = v; } catch {}
  const render = () => {
    document.getElementById('cnt').textContent = count;
    document.getElementById('ml').textContent = (count * 250) + ' / 2000 ml';
    const box = document.getElementById('cups');
    box.innerHTML = Array.from({ length: 8 }, (_, i) => '<div class="cup ' + (i < count ? 'on' : '') + '">' + (i + 1) + '</div>').join('');
  };
  const save = async () => { try { await window.jing?.storage?.set(dayKey, count); } catch {} };
  document.getElementById('add').onclick = async () => {
    count = Math.min(12, count + 1);
    await save(); render();
    if (count === 8) window.jing?.ui?.notify?.('今天 8 杯水达标啦！小鲸为你点赞 💧');
  };
  document.getElementById('rst').onclick = async () => { count = 0; await save(); render(); };
  render();
})();
</script>
</body>
</html>
