<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>深海呼吸引导</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #08131A; color: #F1F5F9; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  }
  .orb {
    width: 170px; height: 170px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22);
    background: radial-gradient(circle, rgba(20,184,166,0.28), rgba(8,19,26,0.9));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 4s ease-in-out;
  }
  .phase { font-size: 20px; font-weight: 300; letter-spacing: 2px; }
  .sec { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 6px; }
  button {
    border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
    background: rgba(255,255,255,0.92); color: #08131A;
    padding: 11px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="orb" id="orb"><div class="phase" id="ph">准备</div><div class="sec" id="sc">4 · 7 · 8 节律</div></div>
  <button id="btn">开始呼吸引导</button>
<script>
(() => {
  try { window.jing?.ui?.setHeaderStyle({ bg: '#08131A', text: '#F1F5F9', dark: true }); } catch {}
  const steps = [{ name: '吸气', sec: 4, scale: 1.24 }, { name: '屏息', sec: 7, scale: 1.24 }, { name: '缓慢呼气', sec: 8, scale: 0.92 }];
  let running = false, idx = 0, left = 0, iv = null;
  const orb = document.getElementById('orb'), ph = document.getElementById('ph'), sc = document.getElementById('sc'), btn = document.getElementById('btn');
  const step = () => {
    if (!running) return;
    if (left <= 0) {
      const s = steps[idx % steps.length];
      idx++; left = s.sec;
      ph.textContent = s.name;
      orb.style.transform = 'scale(' + s.scale + ')';
    }
    sc.textContent = left + ' 秒';
    left--;
  };
  btn.onclick = () => {
    running = !running;
    btn.textContent = running ? '暂停' : '开始呼吸引导';
    if (running) { idx = 0; left = 0; step(); iv = setInterval(step, 1000); }
    else { clearInterval(iv); ph.textContent = '已暂停'; orb.style.transform = 'scale(1)'; }
  };
})();
</script>
</body>
</html>
