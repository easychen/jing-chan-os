<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="jphone-header-bg" content="#FBF8F3" />
<meta name="jphone-header-style" content="dark" />
<meta name="jphone-header-border" content="transparent" />
<meta name="theme-color" content="#FBF8F3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>喵喵计算器</title>
<style>
  :root {
    color-scheme: light;
    --cream: #FBF8F3;
    --ink: #5A4234;
    --ink-soft: #A08A7C;
    --peach: #F6AC74;
    --peach-deep: #DD7C46;
    --rose: #F2A0B6;
    --rose-deep: #E4879F;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    scrollbar-width: none;
  }
  ::-webkit-scrollbar { display: none; width: 0; height: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 背景 ---------- */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 42%;
    transform: scale(1.02);
    pointer-events: none;
    z-index: 0;
  }
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        rgba(251, 248, 243, 0.92) 0%,
        rgba(251, 248, 243, 0.52) 9%,
        rgba(251, 248, 243, 0.08) 24%,
        rgba(251, 248, 243, 0.00) 46%,
        rgba(253, 249, 244, 0.18) 74%,
        rgba(253, 249, 244, 0.55) 100%);
  }
  /* 漂浮的爪印/星星 */
  .drift { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .drift i {
    position: absolute;
    font-style: normal;
    opacity: 0;
    animation: driftUp linear infinite;
    filter: blur(0.2px);
  }
  @keyframes driftUp {
    0%   { opacity: 0; transform: translateY(18px) scale(0.85) rotate(-8deg); }
    18%  { opacity: 0.55; }
    70%  { opacity: 0.32; }
    100% { opacity: 0; transform: translateY(-70px) scale(1.05) rotate(10deg); }
  }

  /* ---------- 布局 ---------- */
  .app {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: calc(var(--safe-t) + 8px) 16px max(48px, calc(var(--safe-b) + 16px));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    flex: 0 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #B87C56;
    padding: 5px 12px 5px 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 4px 14px rgba(190, 148, 118, 0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .brand .paw { font-size: 13px; line-height: 1; }
  .tools { display: flex; gap: 8px; }
  .tool {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.62);
    color: #B87C56;
    box-shadow: 0 4px 14px rgba(190, 148, 118, 0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 0;
    transition: transform .14s cubic-bezier(.34,1.56,.64,1), background .16s;
  }
  .tool:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.9); }
  .tool svg { width: 17px; height: 17px; }

  /* ---------- 显示区 ---------- */
  .display {
    position: relative;
    flex: 0 0 auto;
    height: clamp(138px, 19.5vh, 184px);
    margin-top: 10px;
    padding: 16px 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    border-radius: 28px;
    background: linear-gradient(165deg, rgba(255, 253, 249, 0.86), rgba(255, 249, 242, 0.7));
    border: 1px solid rgba(255, 255, 255, 0.92);
    box-shadow:
      0 16px 34px -12px rgba(188, 142, 108, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px) saturate(1.15);
    -webkit-backdrop-filter: blur(16px) saturate(1.15);
    overflow: hidden;
  }
  .display::after {
    content: "";
    position: absolute;
    right: -40px; top: -52px;
    width: 132px; height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 214, 190, 0.34), rgba(255, 214, 190, 0));
    pointer-events: none;
  }
  .label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px;
    letter-spacing: 0.6px;
    color: #C3A897;
    font-weight: 600;
  }
  .label .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #9FD6C4;
    box-shadow: 0 0 0 3px rgba(159, 214, 196, 0.24);
  }
  .expr {
    margin-top: auto;
    font-size: 17px;
    line-height: 1.35;
    font-weight: 600;
    color: #B39B8B;
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding-top: 8px;
    min-height: 26px;
    letter-spacing: 0.2px;
  }
  .result {
    margin-top: 2px;
    font-size: 52px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
    color: #4E372B;
    transition: font-size .16s ease;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
  }
  .result.pulse { animation: pop .22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.055); }
    100% { transform: scale(1); }
  }

  /* ---------- 小猫 + 气泡 ---------- */
  .mascot-row {
    position: relative;
    flex: 0 0 auto;
    height: clamp(62px, 9.5vh, 88px);
    margin-top: auto;
  }
  .mascot {
    position: absolute;
    left: -4px;
    bottom: -4px;
    height: clamp(118px, 17vh, 152px);
    width: auto;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 12px 16px rgba(178, 128, 92, 0.22));
    animation: bob 4.6s ease-in-out infinite;
    cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    -webkit-user-drag: none;
  }
  .mascot:active { transform: scale(0.95); }
  .mascot.wiggle { animation: wiggle .55s ease-in-out; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-5px) rotate(-1.1deg); }
  }
  @keyframes wiggle {
    0%   { transform: rotate(0) scale(1); }
    22%  { transform: rotate(-6deg) scale(1.06); }
    46%  { transform: rotate(5deg) scale(1.04); }
    70%  { transform: rotate(-3deg) scale(1.02); }
    100% { transform: rotate(0) scale(1); }
  }

  .bubble {
    position: absolute;
    left: clamp(104px, 30vw, 132px);
    bottom: 16px;
    max-width: calc(100% - 150px);
    padding: 8px 14px;
    border-radius: 16px 16px 16px 4px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 8px 20px -6px rgba(180, 134, 104, 0.3);
    font-size: 12.5px;
    font-weight: 600;
    color: #A5795B;
    line-height: 1.45;
    white-space: normal;
    transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble.hide { opacity: 0; transform: translateY(6px) scale(0.96); }

  /* ---------- 键盘 ---------- */
  .pad {
    flex: 0 0 auto;
    margin-top: 14px;
    height: clamp(296px, 43vh, 372px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }

  .key {
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 22px;
    background: rgba(255, 253, 250, 0.62);
    color: #4E372B;
    font-family: inherit;
    font-size: clamp(22px, 6.4vw, 27px);
    font-weight: 700;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    overflow: hidden;
    box-shadow:
      0 6px 16px -6px rgba(180, 134, 104, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px) saturate(1.1);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), background .16s, box-shadow .16s;
    will-change: transform;
  }
  .key:active, .key.hot {
    transform: scale(0.93);
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 2px 8px -4px rgba(180, 134, 104, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }
  .key.fn {
    background: rgba(255, 245, 236, 0.72);
    color: #C9793F;
    font-size: clamp(17px, 4.6vw, 20px);
    font-weight: 700;
  }
  .key.fn:active, .key.fn.hot { background: rgba(255, 236, 220, 0.95); }
  .key.op {
    background: linear-gradient(155deg, #FFD3AF 0%, #F4A970 100%);
    color: #FFFDFA;
    font-size: clamp(24px, 7vw, 29px);
    font-weight: 600;
    border-color: rgba(255, 255, 255, 0.55);
    box-shadow:
      0 8px 18px -6px rgba(226, 147, 98, 0.62),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
    text-shadow: 0 1px 1px rgba(197, 116, 68, 0.28);
  }
  .key.op:active, .key.op.hot {
    background: linear-gradient(155deg, #FFC79B 0%, #E8995F 100%);
    box-shadow: 0 2px 8px -4px rgba(226, 147, 98, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .key.eq {
    background: linear-gradient(155deg, #FFC3D3 0%, #F094AE 100%);
    color: #FFFDFA;
    border-color: rgba(255, 255, 255, 0.6);
    box-shadow:
      0 8px 18px -6px rgba(233, 139, 166, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    font-size: clamp(24px, 7vw, 29px);
  }
  .key.eq:active, .key.eq.hot {
    background: linear-gradient(155deg, #FFB2C6 0%, #E4829C 100%);
  }
  .key svg { width: 24px; height: 24px; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    transform: translate(-50%, -50%) scale(0);
    animation: rip .5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rip {
    to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  /* ---------- 弹层通知 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(var(--safe-t) + 16px);
    transform: translate(-50%, -14px);
    z-index: 60;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(90, 66, 52, 0.9);
    color: #FFF7EF;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .24s ease, transform .24s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 10px 24px -8px rgba(90, 66, 52, 0.6);
    max-width: 82vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 爱心 ---------- */
  .heart {
    position: fixed;
    z-index: 55;
    pointer-events: none;
    font-size: 18px;
    animation: heartUp 1.05s ease-out forwards;
  }
  @keyframes heartUp {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 10px), -86px) scale(1.15) rotate(var(--rot, 8deg)); }
  }

  /* ---------- 历史账本 ---------- */
  .mask {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: rgba(74, 52, 40, 0.34);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .26s ease;
  }
  .mask.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 71;
    max-height: 64dvh;
    display: flex;
    flex-direction: column;
    padding: 8px 18px calc(var(--safe-b) + 22px);
    border-radius: 28px 28px 0 0;
    background: linear-gradient(180deg, #FFFCF7, #FEF6EE);
    box-shadow: 0 -12px 40px -12px rgba(120, 86, 62, 0.4);
    transform: translateY(104%);
    transition: transform .34s cubic-bezier(.3,1,.4,1);
  }
  .sheet.show { transform: translateY(0); }
  .grip {
    width: 38px; height: 4px; border-radius: 2px;
    background: #EBD9C9;
    margin: 4px auto 12px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(210, 182, 158, 0.3);
  }
  .sheet-title { font-size: 15px; font-weight: 800; color: #6B4E3B; letter-spacing: 0.2px; }
  .sheet-clear {
    border: 0;
    background: rgba(255, 236, 226, 0.9);
    color: #C9793F;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .sheet-clear:active { background: #FFE0CB; }
  .sheet-list {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 0 2px;
    scrollbar-width: none;
  }
  .hist {
    width: 100%;
    display: block;
    text-align: left;
    border: 0;
    background: transparent;
    font-family: inherit;
    padding: 10px 4px;
    border-bottom: 1px dashed rgba(210, 182, 158, 0.26);
  }
  .hist:active { background: rgba(255, 240, 228, 0.7); border-radius: 12px; }
  .hist-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .hist-eq { font-size: 12px; color: #B49B8B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-res { font-size: 17px; font-weight: 800; color: #5A4234; font-variant-numeric: tabular-nums; }
  .hist-time { font-size: 10.5px; color: #C7B2A2; margin-top: 2px; }
  .empty {
    text-align: center;
    font-size: 12.5px;
    color: #C7B2A2;
    padding: 28px 0 10px;
    font-weight: 600;
  }
  .empty span { display: block; font-size: 30px; margin-bottom: 8px; }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ---------------- 宿主桥 ---------------- */
  var J = (typeof window.jing !== 'undefined' && window.jing) ? window.jing : null;

  var Store = {
    get: async function (k) {
      try { if (J && J.db && J.db.get) return await J.db.get(k); } catch (e) {}
      try { var v = localStorage.getItem('catcalc:' + k); return v === null ? null : JSON.parse(v); } catch (e) { return null; }
    },
    set: async function (k, v) {
      try { if (J && J.db && J.db.set) return await J.db.set(k, v); } catch (e) {}
      try { localStorage.setItem('catcalc:' + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 1400);
  }

  try {
    if (J && J.ui && J.ui.setHeaderStyle) {
      J.ui.setHeaderStyle({
        backgroundColor: '#FBF8F3',
        foregroundColor: '#5A4234',
        borderColor: 'transparent',
        title: '喵喵计算器'
      });
    }
  } catch (e) {}

  /* ---------------- 音效 ---------------- */
  var state = { tokens: [], shown: '', evaluated: false, ans: 0, sound: true, history: [], lastResult: '0', error: false };
  var ac = null;

  function blip(kind) {
    if (!state.sound) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!ac) ac = new Ctx();
      if (ac.state === 'suspended') ac.resume();
      var t = ac.currentTime;
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = kind === 'meow' || kind === 'err' ? 'sine' : 'triangle';
      var f0 = 780, f1 = 780, dur = 0.07, vol = 0.035;
      if (kind === 'op') { f0 = 640; f1 = 640; dur = 0.06; }
      if (kind === 'eq') { f0 = 680; f1 = 1080; dur = 0.16; vol = 0.045; o.type = 'sine'; }
      if (kind === 'meow') { f0 = 900; f1 = 1350; dur = 0.2; vol = 0.05; }
      if (kind === 'err') { f0 = 380; f1 = 240; dur = 0.2; vol = 0.04; o.type = 'sine'; }
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  /* ---------------- 计算引擎（token 驱动，负号无歧义） ---------------- */
  var OPS = { '+': 1, '−': 1, '×': 2, '÷': 2 };

  function numToken(txt, neg, pct) {
    return { t: 'num', txt: txt, neg: !!neg, pct: !!pct };
  }

  function numValue(tk) {
    var n = parseFloat(String(tk.txt).replace(/[^0-9.]/g, ''));
    if (!isFinite(n)) n = 0;
    if (tk.pct) n = n / 100;
    return tk.neg ? -n : n;
  }

  function exprStringOf(tks) {
    var s = '';
    for (var i = 0; i < tks.length; i++) {
      var tk = tks[i];
      if (tk.t === 'op') s += tk.v;
      else s += (tk.neg ? '−' : '') + tk.txt + (tk.pct ? '%' : '');
    }
    return s;
  }

  // 先折叠 × ÷，再从左到右处理 + −
  function evalTokens(tks) {
    if (!tks || !tks.length) return { ok: false, incomplete: true };
    if (tks[tks.length - 1].t === 'op') return { ok: false, incomplete: true };
    var stack = [], pend = [];
    for (var i = 0; i < tks.length; i++) {
      var tk = tks[i];
      if (tk.t === 'num') { stack.push(numValue(tk)); continue; }
      var next = tks[i + 1];
      if (!next || next.t !== 'num') return { ok: false, incomplete: true };
      if (!stack.length) return { ok: false, incomplete: true };
      if (tk.v === '×' || tk.v === '÷') {
        var a = stack.pop(), b = numValue(next);
        if (tk.v === '÷' && b === 0) return { ok: false, error: 'div0' };
        stack.push(tk.v === '×' ? a * b : a / b);
        i++;
      } else {
        pend.push(tk.v);
      }
    }
    if (stack.length !== pend.length + 1) return { ok: false, incomplete: true };
    var r = stack[0];
    for (var j = 0; j < pend.length; j++) {
      r = pend[j] === '+' ? r + stack[j + 1] : r - stack[j + 1];
    }
    if (!isFinite(r)) return { ok: false, error: 'div0' };
    return { ok: true, value: parseFloat(r.toPrecision(12)) };
  }

  function fmt(n) {
    if (!isFinite(n)) return '喵？';
    var abs = Math.abs(n);
    var s;
    if (abs !== 0 && (abs >= 1e13 || abs < 1e-9)) {
      s = n.toExponential(6).replace(/e([+-])(\d+)/, function (_, sign, d) { return 'e' + sign + d; });
      return s;
    }
    s = String(parseFloat(n.toPrecision(12)));
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + parts.join('.');
  }

  function prettyExpr(s) {
    return s.replace(/[+×÷−]/g, function (c) { return ' ' + c + ' '; }).replace(/\s+/g, ' ').trim();
  }

  /* ---------------- DOM ---------------- */
  var exprEl = document.getElementById('expr');
  var resultEl = document.getElementById('result');
  var bubbleEl = document.getElementById('bubble');
  var mascotEl = document.getElementById('mascot');
  var labelEl = document.getElementById('appLabel');

  var MOODS = [
    '算好啦，喵～',
    '嗯嗯，就是这个数',
    '记在毛线球上啦 🧶',
    '还要算点别的吗？',
    '小猫咪觉得正确 ✨',
    '喵呜～好厉害'
  ];
  var IDLE_MOODS = ['有什么要算的吗喵？', '爪爪准备就绪 🐾', '慢慢算，不着急～', '今天想算点什么呢'];

  function setBubble(text, sticky) {
    bubbleEl.textContent = text;
    bubbleEl.classList.remove('hide');
    if (!sticky) {
      clearTimeout(setBubble._t);
      setBubble._t = setTimeout(function () { bubbleEl.classList.add('hide'); }, 2600);
    }
  }

  function fitResult(text) {
    var len = text.length;
    var size = len <= 8 ? 52 : len <= 11 ? 44 : len <= 14 ? 36 : len <= 18 ? 30 : 24;
    resultEl.style.fontSize = size + 'px';
  }

  function render(animate) {
    var tks = state.tokens;
    if (state.evaluated) {
      exprEl.textContent = state.shown + ' =';
    } else {
      var raw = tks.length ? exprStringOf(tks) : '';
      exprEl.textContent = raw ? prettyExpr(raw) : '';
    }
    exprEl.scrollLeft = exprEl.scrollWidth;

    var text;
    if (state.evaluated) {
      text = fmt(state.ans);
    } else {
      var trimmed = tks.slice();
      while (trimmed.length && trimmed[trimmed.length - 1].t === 'op') trimmed.pop();
      var r = trimmed.length ? evalTokens(trimmed) : { ok: false };
      if (r.ok) text = fmt(r.value);
      else {
        var last = tks.length ? tks[tks.length - 1] : null;
        text = last && last.t === 'num' ? fmt(numValue(last)) : '0';
      }
    }
    if (text !== state.lastResult) {
      state.lastResult = text;
      if (animate) {
        resultEl.classList.remove('pulse');
        void resultEl.offsetWidth;
        resultEl.classList.add('pulse');
      }
    }
    resultEl.textContent = text;
    fitResult(text);
  }

  /* ---------------- 输入 ---------------- */
  function lastTok() {
    return state.tokens.length ? state.tokens[state.tokens.length - 1] : null;
  }

  function resetAll() {
    state.tokens = [];
    state.shown = '';
    state.evaluated = false;
    state.lastResult = '0';
    labelEl.textContent = '小猫咪在线陪你算';
    render();
  }

  function press(k) {
    if (state.error) { state.error = false; resetAll(); }
    if (/^[0-9]$/.test(k)) return digit(k);
    if (k === '.') return dot();
    if (k === 'ac') { resetAll(); return; }
    if (k === 'back') return back();
    if (k === 'pct') return percent();
    if (k === 'sign') return sign();
    if (k === 'eq') return equals();
    if (OPS[k]) return operator(k);
  }

  function digit(d) {
    if (state.evaluated) resetAll();
    var tk = lastTok();
    if (!tk || tk.t === 'op') {
      state.tokens.push(numToken(d, false, false));
    } else {
      if (tk.pct) return;
      var digits = tk.txt.replace(/\./g, '').length;
      if (tk.txt.indexOf('.') >= 0 ? digits >= 13 : digits >= 12) return;
      tk.txt = (tk.txt === '0' || tk.txt === '') ? d : tk.txt + d;
    }
    render();
  }

  function dot() {
    if (state.evaluated) resetAll();
    var tk = lastTok();
    if (!tk || tk.t === 'op') state.tokens.push(numToken('0.', false, false));
    else if (!tk.pct) {
      if (tk.txt.indexOf('.') >= 0) return;
      tk.txt += '.';
    }
    render();
  }

  function operator(op) {
    if (state.evaluated) {
      var v = state.ans;
      state.tokens = [numToken(String(Math.abs(v)), v < 0, false)];
      state.evaluated = false;
      state.shown = '';
    }
    var tk = lastTok();
    if (!tk) {
      if (op === '−') state.tokens.push(numToken('0', true, false));
      render();
      return;
    }
    if (tk.t === 'op') tk.v = op;
    else state.tokens.push({ t: 'op', v: op });
    render();
  }

  function back() {
    if (state.evaluated) { resetAll(); return; }
    var tk = lastTok();
    if (!tk) return;
    if (tk.t === 'op') state.tokens.pop();
    else if (tk.pct) tk.pct = false;
    else if (tk.txt.length > 1) tk.txt = tk.txt.slice(0, -1);
    else state.tokens.pop();
    if (!state.tokens.length) { state.lastResult = ''; }
    render();
  }

  function percent() {
    if (state.evaluated) {
      var v = state.ans;
      state.tokens = [numToken(String(Math.abs(v)), v < 0, false)];
      state.evaluated = false;
      state.shown = '';
    }
    var tk = lastTok();
    if (!tk || tk.t !== 'num' || tk.pct) return;
    tk.pct = true;
    render();
  }

  function sign() {
    if (state.evaluated) {
      var v = state.ans;
      state.tokens = [numToken(String(Math.abs(v)), v < 0, false)];
      state.evaluated = false;
      state.shown = '';
    }
    var tk = lastTok();
    if (!tk || tk.t !== 'num') {
      if (!state.tokens.length) { state.tokens.push(numToken('0', true, false)); render(); }
      return;
    }
    tk.neg = !tk.neg;
    render();
  }

  function equals() {
    var tks = state.tokens.slice();
    while (tks.length && tks[tks.length - 1].t === 'op') tks.pop();
    if (!tks.length) return;
    var r = evalTokens(tks);
    if (!r.ok) {
      if (r.error === 'div0') {
        blip('err');
        labelEl.textContent = '小猫被吓到了';
        setBubble('喵！不能除以 0 哦', true);
        resultEl.textContent = '喵？';
        resultEl.style.fontSize = '44px';
        state.lastResult = '喵？';
        state.error = true;
      }
      return;
    }
    var value = r.value;
    state.ans = value;
    state.shown = prettyExpr(exprStringOf(tks));
    state.evaluated = true;
    state.tokens = [numToken(String(Math.abs(value)), value < 0, false)];
    labelEl.textContent = '刚刚算完一笔';
    blip('eq');
    spawnHearts();
    setBubble(MOODS[Math.floor(Math.random() * MOODS.length)], false);
    render(true);
    addHistory(state.shown, fmt(value));
  }

  /* ---------------- 历史 ---------------- */
  function relTime(ts) {
    var d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    return Math.floor(d / 86400000) + ' 天前';
  }

  function addHistory(e, r) {
    state.history.unshift({ e: e, r: r, t: Date.now() });
    if (state.history.length > 40) state.history = state.history.slice(0, 40);
    Store.set('history', state.history);
    drawHistory();
  }

  function drawHistory() {
    var list = document.getElementById('histList');
    var empty = document.getElementById('histEmpty');
    if (!state.history.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    var html = '';
    for (var i = 0; i < state.history.length; i++) {
      var h = state.history[i];
      html += '<button class="hist" data-i="' + i + '">' +
        '<div class="hist-top"><span class="hist-eq">' + esc(h.e) + '</span>' +
        '<span class="hist-res">' + esc(h.r) + '</span></div>' +
        '<div class="hist-time">' + relTime(h.t) + '</div></button>';
    }
    list.innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var mask = document.getElementById('mask');
  var sheet = document.getElementById('sheet');

  function openSheet() {
    drawHistory();
    mask.classList.add('show');
    sheet.classList.add('show');
  }
  function closeSheet() {
    mask.classList.remove('show');
    sheet.classList.remove('show');
  }

  /* ---------------- 装饰与动效 ---------------- */
  function spawnHearts() {
    var rect = mascotEl.getBoundingClientRect();
    var glyphs = ['❤', '🐾', '✨', '💛'];
    for (var i = 0; i < 4; i++) {
      (function (i) {
        var el = document.createElement('div');
        el.className = 'heart';
        el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        el.style.left = (rect.left + rect.width * (0.3 + Math.random() * 0.5)) + 'px';
        el.style.top = (rect.top + rect.height * 0.35) + 'px';
        el.style.setProperty('--dx', (Math.random() * 50 - 25).toFixed(0) + 'px');
        el.style.setProperty('--rot', (Math.random() * 30 - 15).toFixed(0) + 'deg');
        el.style.fontSize = (14 + Math.random() * 8).toFixed(0) + 'px';
        el.style.animationDelay = (i * 60) + 'ms';
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 1400);
      })(i);
    }
  }

  function makeDrift() {
    var box = document.getElementById('drift');
    var glyphs = ['🐾', '✦', '✧', '·', '❋'];
    for (var i = 0; i < 12; i++) {
      var el = document.createElement('i');
      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.top = (18 + Math.random() * 58) + '%';
      el.style.fontSize = (9 + Math.random() * 10).toFixed(0) + 'px';
      el.style.color = ['#E3B79A', '#F2C2CE', '#A9D3C4'][i % 3];
      el.style.animationDuration = (9 + Math.random() * 8).toFixed(1) + 's';
      el.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
      box.appendChild(el);
    }
  }

  /* ---------------- 事件 ---------------- */
  var pad = document.getElementById('pad');
  var longPressTimer = null;
  var longPressFired = false;

  pad.addEventListener('pointerdown', function (ev) {
    var btn = ev.target.closest('.key');
    if (!btn) return;
    var r = btn.getBoundingClientRect();
    var rip = document.createElement('span');
    rip.className = 'ripple';
    var size = r.width * 1.1;
    rip.style.width = size + 'px';
    rip.style.height = size + 'px';
    rip.style.left = (ev.clientX - r.left) + 'px';
    rip.style.top = (ev.clientY - r.top) + 'px';
    rip.style.opacity = '0.5';
    btn.appendChild(rip);
    setTimeout(function () { rip.remove(); }, 520);

    longPressFired = false;
    clearTimeout(longPressTimer);
    if (btn.dataset.k === 'back' || btn.dataset.k === 'ac') {
      longPressTimer = setTimeout(function () {
        longPressFired = true;
        resetAll();
        blip('err');
        toast('全部清空啦喵');
        if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
      }, 520);
    }
  }, { passive: true });

  pad.addEventListener('pointerup', function () {
    clearTimeout(longPressTimer);
  }, { passive: true });
  pad.addEventListener('pointercancel', function () {
    clearTimeout(longPressTimer);
  }, { passive: true });

  pad.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.key');
    if (!btn) return;
    if (longPressFired) { longPressFired = false; return; }
    var k = btn.dataset.k;
    press(k);
    if (OPS[k]) blip('op');
    else if (k === 'ac' || k === 'back') blip('op');
    else if (k === 'eq') { /* equals 内部已有音效 */ }
    else blip('num');
    if (navigator.vibrate) { try { navigator.vibrate(7); } catch (e) {} }
    if (state.evaluated === false && state.tokens.length) {
      labelEl.textContent = '小猫咪在线陪你算';
    }
  });

  mascotEl.addEventListener('click', function () {
    blip('meow');
    mascotEl.classList.remove('wiggle');
    void mascotEl.offsetWidth;
    mascotEl.classList.add('wiggle');
    spawnHearts();
    var lines = ['喵～', '摸摸头就继续算 🐾', '我在这儿陪你哦', '爪爪按得好准呀', '要伸个懒腰吗喵'];
    setBubble(lines[Math.floor(Math.random() * lines.length)], false);
    if (navigator.vibrate) { try { navigator.vibrate([8, 40, 8]); } catch (e) {} }
  });

  document.getElementById('btnHistory').addEventListener('click', openSheet);
  mask.addEventListener('click', closeSheet);
  document.getElementById('btnClear').addEventListener('click', function () {
    state.history = [];
    Store.set('history', []);
    drawHistory();
    toast('毛线球账本清空啦');
  });

  document.getElementById('histList').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.hist');
    if (!btn) return;
    var item = state.history[Number(btn.dataset.i)];
    if (!item) return;
    var raw = String(item.r).replace(/,/g, '').replace(/−/g, '-');
    if (!/^-?[0-9.]+$/.test(raw)) return;
    var val = parseFloat(raw);
    if (!isFinite(val)) return;
    state.tokens = [numToken(String(Math.abs(val)), val < 0, false)];
    state.evaluated = false;
    state.shown = '';
    closeSheet();
    render(true);
    blip('num');
    toast('取回了 ' + item.r);
  });

  var btnSound = document.getElementById('btnSound');
  function paintSound() {
    var on = state.sound;
    btnSound.querySelectorAll('#wave1, #wave2').forEach(function (p) {
      p.style.opacity = on ? '1' : '0.15';
    });
    var off = btnSound.querySelector('#offMark');
    if (on && off) off.remove();
    if (!on && !off) {
      var svg = btnSound.querySelector('svg');
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('id', 'offMark');
      line.setAttribute('d', 'M15 9.6 20.4 15M20.4 9.6 15 15');
      line.setAttribute('stroke', 'currentColor');
      line.setAttribute('stroke-width', '1.9');
      line.setAttribute('stroke-linecap', 'round');
      svg.appendChild(line);
    }
  }

  btnSound.addEventListener('click', function () {
    state.sound = !state.sound;
    Store.set('sound', state.sound);
    paintSound();
    if (state.sound) blip('meow');
    toast(state.sound ? '喵喵音效已打开' : '音效关闭，安静计算中');
  });

  document.addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (/^[0-9]$/.test(k)) { press(k); blip('num'); }
    else if (k === '.' || k === ',') { press('.'); blip('num'); }
    else if (k === '+') { press('+'); blip('op'); }
    else if (k === '-') { press('−'); blip('op'); }
    else if (k === '*') { press('×'); blip('op'); }
    else if (k === '/') { ev.preventDefault(); press('÷'); blip('op'); }
    else if (k === 'Enter' || k === '=') { ev.preventDefault(); press('eq'); }
    else if (k === 'Backspace') { press('back'); blip('op'); }
    else if (k === 'Escape') { press('ac'); blip('op'); }
    else return;
  });

  /* ---------------- 启动 ---------------- */
  (async function init() {
    makeDrift();
    paintSound();
    render();
    var h = await Store.get('history');
    if (Array.isArray(h)) { state.history = h.slice(0, 40); drawHistory(); }
    var s = await Store.get('sound');
    if (typeof s === 'boolean') { state.sound = s; paintSound(); }
    setBubble(IDLE_MOODS[Math.floor(Math.random() * IDLE_MOODS.length)], true);
  })();
})();
</script>
</body>
</html>
