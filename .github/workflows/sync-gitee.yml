name: Sync to Gitee Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee SSH key secret
        id: check
        env:
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          if [ -n "$GITEE_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GITEE_PRIVATE_KEY secret not set; skipping Gitee mirror."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - name: Mirror to Gitee
        if: steps.check.outputs.enabled == 'true'
        uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        with:
          source-repo: git@github.com:easychen/jing-chan-os.git
          destination-repo: git@gitee.com:easychen/jing-chan-os.git
